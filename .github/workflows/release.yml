name: Release Windows Notch

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build errors if failed
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path build.log) {
            $errs = (Get-Content build.log | Select-String -Pattern "^error" -Context 0,3) | Out-String
            if (-not $errs.Trim()) { $errs = (Get-Content build.log -Tail 80) -join "`n" }
            $body = "## CI Build Error`n``````text`n$($errs.Substring(0, [Math]::Min($errs.Length, 12000)))`n``````"
            gh issue create --title "CI Build Failure ($(git rev-parse --short HEAD))" --body $body
          }

      - name: Package MSIX (Microsoft Store / Sideload)
        shell: pwsh
        run: ./msix/pack-msix.ps1 -ExePath "target/x86_64-pc-windows-msvc/release/notch.exe"

      - name: Optional Authenticode Sign (PFX Certificate)
        if: ${{ secrets.WINDOWS_CERT_PFX != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP/cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1 -ExpandProperty FullName
          $targets = @(
            "target/x86_64-pc-windows-msvc/release/notch.exe",
            "dist/Notch_x64.msix"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              & $signtool sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $t
            }
          }
          Remove-Item $pfxPath -Force

      - name: Prepare Release Bundle & SHA-256 Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bundle | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/notch.exe" "dist/notch.exe" -Force
          Copy-Item "dist/notch.exe" "dist/bundle/notch.exe" -Force
          Compress-Archive -Path "dist/bundle/*" -DestinationPath "dist/notch-windows-x64.zip" -Force
          Remove-Item -Recurse -Force dist/bundle

          $files = @("dist/notch.exe", "dist/Notch_x64.msix", "dist/notch-windows-x64.zip")
          $hashes = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $hashes | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8

      - name: Generate Build Provenance Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/notch.exe
            dist/Notch_x64.msix
            dist/notch-windows-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notch-windows-x64
          path: |
            dist/notch.exe
            dist/Notch_x64.msix
            dist/notch-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/notch.exe
            dist/Notch_x64.msix
            dist/notch-windows-x64.zip
            dist/SHA256SUMS.txt
